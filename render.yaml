services:
  - type: web
    name: imvu-radar-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: IMVU_USER
        sync: false
      - key: IMVU_PASS
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: MAX_WATCHERS
        value: "20"
      - key: TARGET_ROOM_SCAN
        value: "800"
      - key: OWN_ROOM_SCAN
        value: "120"
      - key: BOT_EMAIL
        sync: false
      - key: BOT_PASSWORD
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: BOT_ALLOW_SAME_ACCOUNT
        sync: false
      - key: BOT_MAINTENANCE
        sync: false
      - key: BOT_SEND_INTERVAL_MS
        value: "1500"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RADIO_SECRET
        sync: false
